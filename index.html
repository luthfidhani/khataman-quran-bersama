<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juz Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light py-4">
    <div class="container">
        <div class="card shadow p-4">
            <!-- Judul -->
            <h1 class="text-center mb-4 fw-bold">📖 Juz Tracker</h1>

            <!-- Pilihan Periode & Member -->
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="periodSelect" class="form-label fw-semibold">📅 Select Period</label>
                    <select id="periodSelect" class="form-select"></select>
                </div>
                <div class="col-md-6">
                    <label for="memberSelect" class="form-label fw-semibold">👥 Select Member</label>
                    <select id="memberSelect" class="form-select">
                        <option value="all">All Members</option>
                    </select>
                </div>
            </div>

            <!-- Informasi Periode -->
            <div class="text-center my-4">
                <div class="row">
                    <div class="col-md-6">
                        <p class="text-muted mb-1">📆 <strong>Periode:</strong> <span id="period">-</span></p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted mb-1">⏳ <strong>Start Date:</strong> <span id="startDate">-</span></p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-muted mb-1">🏁 <strong>End Date:</strong> <span id="endDate">-</span></p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-danger fs-5 fw-bold">🕒 Kurang <span id="remainingDays">-</span> hari lagi!</p>
                    </div>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="text-center my-4" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress mb-4" style="height: 30px;">
                <div id="progressDone" class="progress-bar bg-success" role="progressbar" style="width: 0%">
                    ✅ <span class="fw-bold">0%</span>
                </div>
                <div id="progressInProgress" class="progress-bar bg-primary" role="progressbar" style="width: 0%">
                    🔄 <span class="fw-bold">0%</span>
                </div>
                <div id="progressTodo" class="progress-bar bg-secondary" role="progressbar" style="width: 0%">
                    📌 <span class="fw-bold">0%</span>
                </div>
            </div>
            
            <div class="row" id="data-container"></div>
        </div>
    </div>

        <!-- Modal -->
        <div class="modal fade" id="statusModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="statusModalLabel">Update Status - Juz <span id="modalJuzDisplay"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="modalJuz">
                        <input type="hidden" id="modalMember">
                        <select id="modalStatus" class="form-select">
                            <option value="done">Done</option>
                            <option value="in_progress">In Progress</option>
                            <option value="todo">Todo</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="saveStatus" onclick="saveStatus(this)">Save changes</button>
                    </div>
                </div>
            </div>
        </div>
    <footer class="text-center mt-5 py-3 bg-light">
        <p class="mb-1">📖 Juz Tracker | <span class="fw-bold">Keep Going, You Got This! 💪🔥</span></p>
        <p class="text-muted small">Made with ❤️ & ☕ by <strong>Captain Luth</strong></p>
    </footer>
        
<script src="script.js"></script>
</body>
</html>
